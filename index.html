<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>仿B站移动端滑动加载</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f5f5;
        }
        /* 顶部导航栏 */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background-color: #fff;
            padding: 0 10px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #eee;
            z-index: 100;
        }
        .search-box {
            flex: 1;
            height: 32px;
            background-color: #f0f0f0;
            border-radius: 16px;
            padding: 0 15px;
            display: flex;
            align-items: center;
            margin: 0 10px;
        }
        .search-box input {
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
            font-size: 14px;
        }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #fb7299;
        }
        /* 标签栏 */
        .tab-bar {
            position: fixed;
            top: 50px;
            left: 0;
            right: 0;
            height: 44px;
            background-color: #fff;
            display: flex;
            align-items: center;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 1px solid #eee;
            z-index: 99;
        }
        .tab-bar::-webkit-scrollbar {
            display: none;
        }
        .tab-item {
            padding: 0 15px;
            height: 100%;
            line-height: 44px;
            font-size: 15px;
            color: #666;
        }
        .tab-item.active {
            color: #fb7299;
            border-bottom: 2px solid #fb7299;
        }
        /* 视频列表 */
        .video-list {
            margin-top: 94px;
            padding: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr; /* 两列布局（B站移动端） */
            gap: 10px;
        }
        /* 视频卡片 */
        .video-card {
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
        }
        .video-cover {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #ccc;
            position: relative;
        }
        .video-time {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background-color: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 12px;
            padding: 2px 5px;
            border-radius: 3px;
        }
        .video-info {
            padding: 8px;
        }
        .video-title {
            font-size: 14px;
            color: #333;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* 标题两行省略 */
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 5px;
        }
        .video-author {
            font-size: 12px;
            color: #999;
            margin-bottom: 3px;
        }
        .video-data {
            font-size: 11px;
            color: #999;
            display: flex;
            align-items: center;
        }
        /* 加载中提示 */
        .loading {
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            color: #999;
            grid-column: 1 / 3; /* 跨两列 */
        }
        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50px;
            background-color: #fff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #eee;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            color: #666;
        }
        .nav-item.active {
            color: #fb7299;
        }
        .nav-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }
    </style>
    <!-- 引入图标库（替代B站图标） -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 顶部导航 -->
    <div class="header">
        <<i class="fa fa-search" style="font-size: 18px; color: #666;"></</i>
        <div class="search-box">
            <input type="text" placeholder="quest 3">
        </div>
        <div class="avatar"></div>
    </div>

    <!-- 标签栏 -->
    <div class="tab-bar">
        <div class="tab-item">直播</div>
        <div class="tab-item active">推荐</div>
        <div class="tab-item">热门</div>
        <div class="tab-item">分区</div>
        <div class="tab-item">番剧</div>
        <div class="tab-item">影视</div>
    </div>

    <!-- 视频列表 -->
    <div class="video-list" id="videoList">
        <!-- 视频卡片由JS动态生成 -->
    </div>

    <!-- 加载提示 -->
    <div class="loading" id="loading">加载中...</div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <div class="nav-icon"><<i class="fa fa-home"></</i></div>
            <span>首页</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon"><<i class="fa fa-bell"></</i></div>
            <span>动态</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon"><<i class="fa fa-video"></</i></div>
            <span>媒体库</span>
        </div>
    </div>

    <script>
        // 模拟视频数据
        const videoData = [
            { title: "BJ雷颖", author: "孤秒", play: "4537", time: "05:05", date: "3天前" },
            { title: "命苦就命苦 还忧郁是天赋", author: "妮蔻-主Ren", play: "9168", time: "00:10", date: "11月22日" },
            { title: "电动车两天烧了三个控制器，好在电机没坏", author: "初心维修阿凡", play: "3.5万", time: "04:01", date: "9月25日" },
            { title: "最新 Quest3、3s全流程注册+激活+领60美刀+...", author: "爱玩VR的杰林", play: "7970", time: "1:33", date: "11月19日" },
            { title: "【巫师】AI下一个要搞死的行业是什么", author: "巫师", play: "52.2万", time: "07:19", date: "23小时前" },
            { title: "一根牙签就能给盒饭加热？二十年前的自热…", author: "怀旧玩家", play: "1.9万", time: "03:03", date: "昨天" }
        ];

        // 页码和加载状态
        let page = 1;
        let isLoading = false;
        const videoList = document.getElementById('videoList');
        const loading = document.getElementById('loading');

        // 生成视频卡片
        function renderVideoCards(data) {
            data.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="video-cover">
                        <div class="video-time">${video.time}</div>
                    </div>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                        <div class="video-author">${video.author}</div>
                        <div class="video-data">
                            <<i class="fa fa-play-circle-o" style="margin-right: 3px;"></</i>${video.play}
                            <span style="margin-left: 5px;">${video.date}</span>
                        </div>
                    </div>
                `;
                videoList.appendChild(card);
            });
        }

        // 初始加载第一页
        renderVideoCards(videoData);

        // 监听滚动事件：滑动到底部加载更多
        window.addEventListener('scroll', () => {
            // 计算滚动位置：文档高度 - 视口高度 - 滚动条位置 < 100px 表示接近底部
            const scrollBottom = document.documentElement.scrollHeight - window.innerHeight - document.documentElement.scrollTop;
            if (scrollBottom < 100 && !isLoading) {
                loadMore();
            }
        });

        // 加载更多数据
        function loadMore() {
            isLoading = true;
            loading.textContent = '加载中...';
            
            // 模拟接口请求延迟
            setTimeout(() => {
                page++;
                // 模拟更多数据（实际项目中替换为真实接口请求）
                const moreData = videoData.map(item => ({
                    ...item,
                    title: `${item.title}（第${page}页）`
                }));
                renderVideoCards(moreData);
                
                isLoading = false;
                loading.textContent = '上滑加载更多';

                // 模拟无更多数据
                if (page > 3) {
                    loading.textContent = '没有更多内容了';
                }
            }, 1000);
        }
    </script>
</body>
</html>
