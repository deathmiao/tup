<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二次元图片查看器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
        .img-container { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; /* 用于承载点击区域 */
        }
        /* 左右点击区域（占满整个容器，分左右两半） */
        .img-container .click-area {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            cursor: pointer;
            z-index: 10; /* 确保点击区域在图片上方 */
        }
        .img-container .prev-area { left: 0; }
        .img-container .next-area { right: 0; }
        .img-container img { 
            max-width: 90%; 
            max-height: 90%; 
            border-radius: 10px; 
            box-shadow: none; 
            transition: opacity 0.5s ease; 
            opacity: 0;
        }
        .img-container img.loaded {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="img-container">
        <!-- 左右点击区域 -->
        <div class="click-area prev-area" onclick="changeImg(-1)"></div>
        <div class="click-area next-area" onclick="changeImg(1)"></div>
        <img id="currentImg" src="" alt="二次元图片">
    </div>

    <script>
        const imgList = [
            ' "https://img.xjh.me/random_img.php?type=anime&return=302&t
        ];
        let currentIndex = 0;
        const imgElement = document.getElementById('currentImg');

        function loadImage() {
            imgElement.style.opacity = 0;
            imgElement.onload = () => {
                imgElement.classList.add('loaded');
            };
            imgElement.src = imgList[currentIndex];
        }

        window.onload = loadImage;

        function changeImg(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = imgList.length - 1;
            if (currentIndex >= imgList.length) currentIndex = 0;
            imgElement.classList.remove('loaded');
            setTimeout(loadImage, 300);
        }
    </script>
</body>
</html>
